

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Arogya Physiotherapy Center</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background: #f2f5fb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 35px rgba(0,0,0,.08);
        }

        .brand {
            color: #2454a6;
            font-weight: 700;
        }

        .btn-login {
            background: #2454a6;
            color: #fff;
            padding: 11px;
            font-weight: 600;
        }

        .btn-login:hover {
            background: #193e80;
            color: #fff;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <h3 class="brand">AROGYA</h3>
        <h5 class="mb-1">Admin Login</h5>
        <p class="text-muted small">Arogya Physiotherapy Center</p>
    </div>

    
    
    <form method="POST" action="http://127.0.0.1:8000/admin/login">
        <input type="hidden" name="_token" value="mZHn4HE3ER9f9fAYYSlSgQuinzxCCG1yivoEei9I" autocomplete="off">
        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input
                type="email"
                name="email"
                class="form-control"
                value=""
                placeholder="Enter admin email"
                required
                autofocus
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter password"
                required
            >
        </div>

        <div class="form-check mb-3">
            <input
                type="checkbox"
                name="remember"
                value="1"
                class="form-check-input"
                id="remember"
            >
            <label class="form-check-label" for="remember">
                Remember me
            </label>
        </div>

        <button type="submit" class="btn btn-login w-100">
            Login to Dashboard
        </button>
    </form>

    <div class="text-center mt-4">
        <a href="http://127.0.0.1:8000" class="text-decoration-none small">
            ← Back to Website
        </a>
    </div>
</div>

</body>
</html>
